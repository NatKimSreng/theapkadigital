<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coming Soon — TheApKa Digital</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hanuman:wght@300;400;700&family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --gold-dark: #8B6914;
    --deep: #0D0A05;
    --deep2: #1A1408;
    --deep3: #241C0C;
    --cream: #F5EDD6;
    --cream2: #EAD9B0;
    --red: #8B1A1A;
    --red-light: #B22222;
    --text: #F5EDD6;
    --text-muted: #C4A96E;
  }

  html, body {
    height: 100%;
    background: var(--deep);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
  }

  /* ── Background: Khmer geometric pattern ── */
  .bg-pattern {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .bg-pattern svg {
    width: 100%;
    height: 100%;
    opacity: 0.07;
  }

  /* ── Radial glow ── */
  .bg-glow {
    position: fixed;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(ellipse 70% 60% at 50% 40%, rgba(201,168,76,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 50% 100%, rgba(139,26,26,0.15) 0%, transparent 60%);
    pointer-events: none;
  }

  /* ── Top & bottom temple border ── */
  .temple-border-top,
  .temple-border-bottom {
    position: fixed;
    left: 0;
    right: 0;
    z-index: 2;
    height: 120px;
  }
  .temple-border-top { top: 0; }
  .temple-border-bottom { bottom: 0; transform: scaleY(-1); }

  /* ── Main content ── */
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 2rem 1.5rem;
    max-width: 700px;
    width: 100%;
  }

  /* ── Angkor lotus ornament ── */
  .ornament-top {
    display: flex;
    justify-content: center;
    margin-bottom: 2rem;
  }

  /* ── Logo / site name ── */
  .site-name {
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 1.25rem;
  }

  /* ── Divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
    margin: 1.25rem auto;
    width: 280px;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-dark), transparent);
  }
  .divider-diamond {
    width: 6px;
    height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* ── Main headline ── */
  .headline {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 8vw, 5rem);
    font-weight: 500;
    line-height: 1.08;
    color: var(--cream);
    letter-spacing: -0.01em;
    margin-bottom: 0.5rem;
  }

  .headline-khmer {
    font-family: 'Hanuman', serif;
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    font-weight: 400;
    color: var(--gold);
    letter-spacing: 0.05em;
    margin-bottom: 2rem;
    display: block;
  }

  /* ── Body text ── */
  .body-text {
    font-size: 0.95rem;
    line-height: 1.75;
    color: var(--text-muted);
    max-width: 440px;
    margin: 0 auto 2.5rem;
    font-weight: 300;
  }

  /* ── Email form ── */
  .email-form {
    display: flex;
    gap: 0;
    max-width: 420px;
    margin: 0 auto 2.5rem;
    border: 1px solid var(--gold-dark);
    border-radius: 2px;
    overflow: hidden;
  }

  .email-form input {
    flex: 1;
    background: rgba(201,168,76,0.05);
    border: none;
    outline: none;
    padding: 0.85rem 1.25rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.875rem;
    color: var(--cream);
    min-width: 0;
  }

  .email-form input::placeholder {
    color: rgba(196,169,110,0.5);
  }

  .email-form button {
    background: var(--gold);
    border: none;
    cursor: pointer;
    padding: 0.85rem 1.5rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--deep);
    white-space: nowrap;
    transition: background 0.2s;
  }

  .email-form button:hover {
    background: var(--gold-light);
  }

  /* ── Social row ── */
  .social-row {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 3rem;
  }

  .social-link {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    transition: color 0.2s;
  }

  .social-link:hover { color: var(--gold); }

  .social-icon {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  /* ── Contact email ── */
  .contact-line {
    font-size: 0.75rem;
    color: rgba(196,169,110,0.6);
    letter-spacing: 0.08em;
  }

  .contact-line a {
    color: var(--gold);
    text-decoration: none;
  }

  /* ── Ornament bottom ── */
  .ornament-bottom {
    display: flex;
    justify-content: center;
    margin-top: 2rem;
    opacity: 0.6;
  }

  /* ── Success message ── */
  .success-msg {
    display: none;
    font-size: 0.85rem;
    color: var(--gold-light);
    letter-spacing: 0.06em;
    margin-top: 0.75rem;
  }
</style>

<!-- Main content -->
<main class="content">

  <!-- Lotus ornament SVG -->
  <div class="ornament-top">
    <svg width="120" height="80" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
      <!-- Central lotus -->
      <path d="M60,70 Q60,45 45,35 Q55,50 60,55 Q65,50 75,35 Q60,45 60,70Z" fill="#C9A84C" opacity="0.9"/>
      <path d="M60,70 Q60,40 30,28 Q48,48 60,55 Q72,48 90,28 Q60,40 60,70Z" fill="#C9A84C" opacity="0.6"/>
      <path d="M60,70 Q60,35 15,22 Q44,47 60,55 Q76,47 105,22 Q60,35 60,70Z" fill="#C9A84C" opacity="0.35"/>
      <!-- Stem -->
      <line x1="60" y1="70" x2="60" y2="78" stroke="#C9A84C" stroke-width="1.5"/>
      <!-- Floating petals left -->
      <path d="M38,58 Q28,48 20,55 Q30,52 38,58Z" fill="#C9A84C" opacity="0.5"/>
      <path d="M26,50 Q18,38 10,44 Q20,40 26,50Z" fill="#C9A84C" opacity="0.35"/>

      <path d="M94,50 Q102,38 110,44 Q100,40 94,50Z" fill="#C9A84C" opacity="0.35"/>

      <line x1="20" y1="18" x2="100" y2="18" stroke="#C9A84C" stroke-width="0.5" opacity="0.5"/>
      <line x1="30" y1="12" x2="90" y2="12" stroke="#C9A84C" stroke-width="0.5" opacity="0.35"/>

      <rect x="28" y="16" width="3" height="3" transform="rotate(45 30 18)" fill="#C9A84C" opacity="0.5"/>
      <rect x="88" y="16" width="3" height="3" transform="rotate(45 90 18)" fill="#C9A84C" opacity="0.5"/>

  <!-- Brand name -->

  <!-- Divider -->
  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-diamond"></div>
    <div class="divider-line"></div>

  <!-- Headlines -->
  <h1 class="headline">Coming<br>Soon</h1>
  <span class="headline-khmer">កំពុងរៀបចំ • នឹងមកដល់ឆាប់ៗ</span>

  <!-- Body -->
  <p class="body-text">
    Something extraordinary is being crafted for you.<br>
    A new digital experience rooted in Cambodia — launching soon.
  </p>

  <!-- Email form -->
  <form class="email-form" id="notifyForm" onsubmit="handleSubmit(event)">
    <input type="email" id="emailInput" placeholder="your@email.com" required autocomplete="email">
    <button type="submit">Notify me</button>

</main>

<script>
  function handleSubmit(e) {
    e.preventDefault();
    const email = document.getElementById('emailInput').value;
    if (!email) return;
    document.getElementById('notifyForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  }
</script>
</body>
</html>
